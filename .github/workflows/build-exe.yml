name: Собрать Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Сборка Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build web app
        run: pnpm --filter @workspace/roadmap-builder run build
        env:
          BASE_PATH: /
          PORT: 3000
          NODE_ENV: production

      - name: Install Electron deps
        working-directory: roadmap-electron
        run: npm install

      - name: Build Windows installer
        working-directory: roadmap-electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Roadmap Builder — последняя версия"
          body: |
            Скачайте **Roadmap Builder Setup.exe** и запустите — установится как обычная программа.
          files: roadmap-electron/dist-electron/*.exe
          make_latest: true
