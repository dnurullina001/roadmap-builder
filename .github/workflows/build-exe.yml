name: Собрать Вектор .exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── Job 1: собираем веб на Linux ──────────────────────────────────────────
  build-web:
    name: Сборка веб-приложения (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web app
        # BASE_PATH=./ → Vite генерирует относительные пути ./assets/...
        # Electron открывает через file://, поэтому нужны ОТНОСИТЕЛЬНЫЕ пути
        run: pnpm --filter @workspace/roadmap-builder run build
        env:
          BASE_PATH: ./
          PORT: 3000
          NODE_ENV: production

      - name: Upload built web app
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: artifacts/roadmap-builder/dist/public
          retention-days: 1

  # ── Job 2: упаковываем EXE на Windows ────────────────────────────────────
  build-exe:
    name: Сборка Windows .exe
    runs-on: windows-latest
    needs: build-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download built web app
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          # Кладём прямо в roadmap-electron/app-dist/
          # electron-builder включит эту папку в files[]
          path: roadmap-electron/app-dist

      - name: Install Electron deps
        working-directory: roadmap-electron
        run: npm install

      - name: Build Windows installer + ZIP
        working-directory: roadmap-electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Вектор — последняя версия"
          body: |
            ## Вектор — инструмент для дорожных карт
            
            **Установщик:** `Вектор Setup 1.0.0.exe` — скачайте и запустите, появится ярлык на рабочем столе.  
            **Portable ZIP:** `Вектор-1.0.0-win.zip` — распакуйте архив, запустите `Вектор.exe` внутри.
          files: |
            roadmap-electron/dist-electron/*.exe
            roadmap-electron/dist-electron/*.zip
          make_latest: true
