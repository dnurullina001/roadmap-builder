name: Собрать Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Установить зависимости проекта
        # --no-frozen-lockfile нужен чтобы pnpm докачал
        # Windows-специфичные нативные бинарники (rollup, esbuild и т.д.)
        # которых нет в lockfile созданном на Linux
        run: pnpm install --no-frozen-lockfile

      - name: Собрать веб-приложение
        run: pnpm --filter @workspace/roadmap-builder run build
        env:
          BASE_PATH: /
          PORT: 3000
          NODE_ENV: production

      - name: Установить зависимости Electron
        working-directory: roadmap-electron
        run: npm install

      - name: Собрать Windows-инсталлятор
        working-directory: roadmap-electron
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Опубликовать в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Roadmap Builder — последняя версия"
          body: |
            Скачайте **Roadmap Builder Setup.exe** и запустите — установится как обычная программа.
          files: roadmap-electron/dist-electron/*.exe
          make_latest: true
